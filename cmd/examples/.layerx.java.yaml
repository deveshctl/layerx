# layerx Java starter config
# Checks build caches and redundant build outputs. Review for your image.
version: 1

# TUI colour theme.
# Precedence (highest to lowest):
#   1. --theme flag on the command line
#   2. theme: in this file
#   3. built-in default (tokyo-night)
#
# Available themes: tokyo-night, catppuccin-mocha, kanagawa, gruvbox-dark,
#                   rose-pine, dracula, oxocarbon, cyberdream
#
# theme: tokyo-night

# CI thresholds: omitted values use defaults; set 0 to disable a rule.
# Used by layerx ci and CI=true; layerx compare ignores this file.
rules:
  lowest-efficiency: 0.9
  highest-user-wasted-percent: 0.1

path-rules:
  block:
    - "**/.git/**"
    - "/root/.m2/repository/**"   # Maven local repo, build-time only
    - "/root/.gradle/caches/**"
    - "/tmp/**"

  deny-waste:
    - "**/*.jar.original"          # spring-boot rebuild artifact
    - "**/target/**"               # fail if earlier build outputs waste space
