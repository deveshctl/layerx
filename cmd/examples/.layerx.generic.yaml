# layerx generic starter config
# Catches version-control metadata and editor scratch files in any image.
# No language-specific assumptions — safe baseline for any team.
version: 1

# theme: default       # one of: default, latte, frappe, macchiato, nord, minimal
                       # run "layerx themes" to list with descriptions.

rules:
  lowest-efficiency: 0.9
  highest-user-wasted-percent: 0.1

path-rules:
  block:
    - "**/.git/**"           # git metadata never belongs in a runtime image
    - "**/.svn/**"
    - "**/.hg/**"
    - "/tmp/**"              # build-time temp files
    - "/var/tmp/**"
    - "**/.DS_Store"         # macOS finder droppings
    - "**/Thumbs.db"         # Windows explorer droppings
    - "**/*.swp"             # vim swap files
