# layerx Node.js starter config
# Catches the two patterns that consistently bloat Node images:
# package-manager caches and node_modules rebuilt across layers.
version: 1

# TUI colour theme.
# Precedence (highest to lowest):
#   1. --theme flag on the command line
#   2. theme: in this file
#   3. built-in default (tokyo-night)
#
# Available themes: tokyo-night, catppuccin-mocha, kanagawa, gruvbox-dark,
#                   rose-pine, dracula, oxocarbon, cyberdream
#
# theme: tokyo-night

rules:
  lowest-efficiency: 0.9
  highest-user-wasted-percent: 0.1

path-rules:
  block:
    - "**/.git/**"
    - "**/.npm/_cacache/**"      # npm download cache
    - "**/.yarn/cache/**"
    - "**/.pnpm-store/**"
    - "/root/.npm/**"
    - "/tmp/**"

  deny-waste:
    - "**/node_modules/**"        # fail if earlier copies waste space
    - "**/*.map"                  # fail if earlier source maps waste space
