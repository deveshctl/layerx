version: 2

builds:
  - main: .
    binary: layerx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Per-archive SBOM in SPDX-JSON via syft. One file per archive,
# named "<archive>.sbom.json", attached to the GitHub release.
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

# Keyless cosign signature over the checksums file. Signing the checksums
# binds every artifact in the release through one signature; verifiers grab
# checksums.txt + checksums.txt.sig + checksums.txt.pem and replay the hash.
# OIDC identity is the GitHub Actions workflow itself.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    # Surface cosign's stdout/stderr in the release log even without
    # --verbose, so a signing failure is diagnosable from the Actions run.
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"

nfpms:
  - package_name: layerx
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - deb
      - rpm
    maintainer: Devesh Pharswan <deveshpharswan@gmail.com>
    description: Terminal-based Docker image layer inspector
    homepage: https://github.com/deveshctl/layerx
    license: MIT
    bindir: /usr/bin

brews:
  - name: layerx
    repository:
      owner: deveshctl
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/deveshctl/layerx
    description: Terminal-based Docker image layer inspector
    license: MIT
    test: |
      system "#{bin}/layerx", "--version"

scoops:
  - name: layerx
    repository:
      owner: deveshctl
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/deveshctl/layerx
    description: Terminal-based Docker image layer inspector
    license: MIT

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
