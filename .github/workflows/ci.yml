name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

# Least-privilege default. No job in this workflow needs write scopes.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5.5'
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5.5'
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5.5'
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.12

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5.5'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5.5'
      # Short PR-time fuzz smoke. Each fuzz target gets 60s; the nightly
      # workflow runs longer budgets. The matrix expands as new Fuzz* targets
      # are added — keep this list in sync with image/*_fuzz_test.go.
      # 60s (up from 30s) leaves headroom past Go's coverage-gathering warmup
      # so a worker landing on a slow input near the deadline doesn't trip
      # "context deadline exceeded" on shared runners.
      - run: go test -run=^$ -fuzz=FuzzReadManifestFromSpool -fuzztime=60s ./image
      - run: go test -run=^$ -fuzz=FuzzScanBlobIndex      -fuzztime=60s ./image
      - run: go test -run=^$ -fuzz=FuzzFindFileInLayer    -fuzztime=60s ./image

  test-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.5.5'
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Resolve runner UID
        id: uid
        run: echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
      - name: Start Podman socket service
        run: |
          if systemctl --user enable --now podman.socket 2>/dev/null; then
            echo "Podman socket started via systemd"
          else
            podman system service --time=0 \
              "unix:///run/user/${{ steps.uid.outputs.uid }}/podman/podman.sock" &
            for i in 1 2 3 4 5; do
              if [ -S "/run/user/${{ steps.uid.outputs.uid }}/podman/podman.sock" ]; then
                break
              fi
              sleep 1
            done
          fi
          test -S "/run/user/${{ steps.uid.outputs.uid }}/podman/podman.sock"
      - name: Run image/ and cmd/ tests against Podman
        env:
          DOCKER_HOST: unix:///run/user/${{ steps.uid.outputs.uid }}/podman/podman.sock
        run: go test -v -count=1 ./image/... ./cmd/...
      - name: Smoke test - archive mode against podman save
        run: |
          podman pull alpine:3
          podman save -o /tmp/alpine.tar alpine:3
          go run . --json /tmp/inspect.json /tmp/alpine.tar
          test -s /tmp/inspect.json
          grep -q '"layers"' /tmp/inspect.json
