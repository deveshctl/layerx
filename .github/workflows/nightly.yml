name: Nightly

on:
  schedule:
    # 06:17 UTC daily — off-the-hour to avoid GH Actions queue spikes.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      # Longer-budget fuzz across the same targets PRs run. 5 minutes per
      # target is enough to surface coverage-guided crashes the 30s PR smoke
      # cannot. Crashes are surfaced by go test's non-zero exit; failing
      # corpora land under image/testdata/fuzz and should be committed
      # alongside the fix when one is found.
      - run: go test -run=^$ -fuzz=FuzzReadManifestFromSpool -fuzztime=5m ./image
      - run: go test -run=^$ -fuzz=FuzzScanBlobIndex      -fuzztime=5m ./image
      - run: go test -run=^$ -fuzz=FuzzFindFileInLayer    -fuzztime=5m ./image

  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
