# Release pipeline:
#   1. goreleaser builds binaries, tarballs, deb/rpm, signs the checksums
#      file with cosign (keyless via GitHub OIDC), and attaches an SPDX
#      SBOM per archive.
#   2. The SLSA reusable workflow generates a non-forgeable provenance
#      attestation over the checksums file and uploads it to the release.
#
# Verification commands live in SECURITY.md.

name: Release

on:
  push:
    tags:
      - "v*"

# Workflow-default is read-only. Each job opts into the writes it needs.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      # Push the GitHub release, upload assets.
      contents: write
      # Mint the OIDC token cosign uses for keyless signing.
      id-token: write
      # Allow goreleaser to push attestations / SBOMs as release assets.
      attestations: write
    outputs:
      # Base64-encoded checksums.txt content. The SLSA generator consumes
      # this to attest each artifact listed in the file.
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26'

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Export checksums for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          # GoReleaser writes its full artifact catalog to dist/artifacts.json.
          # The Checksum entry holds the path to checksums.txt; we base64-
          # encode it for the SLSA reusable workflow's `base64-subjects`
          # input, which then attests every file listed inside.
          checksum_path=$(jq -r '.[] | select(.type=="Checksum") | .path' dist/artifacts.json)
          if [ -z "$checksum_path" ] || [ ! -f "$checksum_path" ]; then
            echo "checksums.txt not found in dist/artifacts.json" >&2
            exit 1
          fi
          echo "hashes=$(base64 -w0 < "$checksum_path")" >> "$GITHUB_OUTPUT"

  provenance:
    needs: [goreleaser]
    permissions:
      # Required by the SLSA generator: mint OIDC token, write the release.
      id-token: write
      contents: write
      actions: read
    # Pinned to a release tag (not SHA) per slsa-github-generator's own
    # guidance — it self-verifies its builder identity at runtime.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      upload-assets: true
