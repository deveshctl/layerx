# OpenSSF Scorecard analysis. Runs weekly + on pushes to main + on branch
# protection rule edits, publishes results to the public Scorecard API so
# the project earns a badge, and uploads SARIF to GitHub code-scanning.
#
# Pinned by full commit SHA per Scorecard's own Pinned-Dependencies check.
# Renovate's digest updater keeps the SHAs current.

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # 06:13 UTC every Monday — off-the-hour to avoid GH Actions queue spikes.
    - cron: '13 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload findings to GitHub code-scanning.
      security-events: write
      # Mint OIDC token for Sigstore-signed publishing of results.
      id-token: write
      # Read non-public Scorecard signals (branch protection, webhook config).
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing makes the score public and unlocks the README badge.
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
